name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Ingest commits use GITHUB_TOKEN, which does not trigger `push` workflows.
  # Chain off the sync job so new CDC periods still reach GitHub Pages.
  workflow_run:
    workflows: ["Sync China CDC data"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run.head_sha is the pre-ingest checkout. Always publish
          # current main, which already includes the auto-commit when present.
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # Project site: https://dailypartita.github.io/cn_cdc_dashboard/
          PAGES_BASE_PATH: /cn_cdc_dashboard
          NEXT_PUBLIC_BASE_PATH: /cn_cdc_dashboard
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
