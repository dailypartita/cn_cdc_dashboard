name: Sync China CDC data

# Airflow is the weekly runner. Keep this as a manual backup if the scheduler is down.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cdc-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Ingest sentinel, notifiable, and variant CSVs
        id: ingest
        run: node scripts/sync-data.mjs
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: ingest CDC data (${{ steps.ingest.outputs.summary }})"
          file_pattern: data
