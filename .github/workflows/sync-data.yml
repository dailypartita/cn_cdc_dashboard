name: Sync China CDC data

# GitHub Actions is the scheduled ingest. Airflow can still run on a
# domestic worker as a network backup. concurrency below serializes overlap.
on:
  schedule:
    # UTC 06:00 Tue/Fri/Sun ≈ Asia/Shanghai 14:00
    - cron: "0 6 * * 2,5,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cdc-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Ingest sentinel, notifiable, and variant CSVs
        id: ingest
        run: node scripts/sync-data.mjs
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: ingest CDC data (${{ steps.ingest.outputs.summary }})"
          file_pattern: data
