name: Sync China CDC data

# GitHub Actions is the scheduled ingest. Airflow can still run on a
# domestic worker as a network backup. concurrency below serializes overlap.
on:
  schedule:
    # Sentinel weeks are published Thursday ~12:30 UTC (20:30 Asia/Shanghai;
    # one recent week was 15:37 UTC). The old 06:00 UTC Tue/Fri/Sun cron
    # does not run after that post until Friday, and GitHub then delays
    # the slot by several hours, so Friday morning Shanghai still shows
    # the previous week. 16:00 UTC is after those posts; the usual delay
    # still finishes overnight. Daily also picks up mid-week monthly bulletins.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cdc-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install poppler for CNIC weekly PDFs
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Ingest sentinel, notifiable, variant, and CNIC CSVs
        id: ingest
        run: node scripts/sync-data.mjs
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: ingest CDC data (${{ steps.ingest.outputs.summary }})"
          file_pattern: data
